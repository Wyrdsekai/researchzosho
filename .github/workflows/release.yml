name: Release

# Attest published release artifacts with Sigstore (keyless).
#
# This workflow BUILDS NOTHING. The artifact is built and tried on real machines before the release is
# published. After publication this workflow downloads it, checks it against the release's own
# SHA256SUMS, signs the hash with Sigstore keyless signing, and uploads <asset>.sigstore.json beside it.
#
# What the signature means: "the ResearchZosho release workflow, at this tag, blessed these exact
# bytes." It is an authenticity statement from the project's CI identity, not build provenance,
# because this runner did not build the bytes. The predicate says so.
#
# Verify, from any machine with the GitHub CLI (2.49+):
#   gh attestation verify researchzosho-X.Y.Z.tar.gz --repo Wyrdsekai/researchzosho \
#     --predicate-type https://researchzosho.org/attestation/release/v1

on:
  release:
    types: [published]
  workflow_dispatch: {}     # gh workflow run release.yml --ref vX.Y.Z  (the ref MUST be the tag)

permissions:
  contents: write
  id-token: write        # Sigstore, npm trusted publishing, the MCP Registry's OIDC login
  attestations: write
  packages: write        # the image on ghcr.io

jobs:
  attest:
    name: Attest ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false     # one unattested artifact must not hide the others
      matrix:
        include:
          # pattern: what gh downloads (a glob; the plain tarball's would match the platform builds too, since "x64"
          # ends in a digit — the 0.1.6 run refused six files); name: the one file the job attests, an exact expression
          - { artifact: tarball,      pattern: 'researchzosho-*.tar.gz',              name: 'researchzosho-[0-9.]+\.tar\.gz' }
          - { artifact: linux-x64,    pattern: 'researchzosho-*-linux-x64.tar.gz',    name: 'researchzosho-[0-9.]+-linux-x64\.tar\.gz' }
          - { artifact: linux-arm64,  pattern: 'researchzosho-*-linux-arm64.tar.gz',  name: 'researchzosho-[0-9.]+-linux-arm64\.tar\.gz' }
          - { artifact: macos-x64,    pattern: 'researchzosho-*-macos-x64.tar.gz',    name: 'researchzosho-[0-9.]+-macos-x64\.tar\.gz' }
          - { artifact: macos-arm64,  pattern: 'researchzosho-*-macos-arm64.tar.gz',  name: 'researchzosho-[0-9.]+-macos-arm64\.tar\.gz' }
          - { artifact: windows-x64,  pattern: 'researchzosho-*-windows-x64.tar.gz',  name: 'researchzosho-[0-9.]+-windows-x64\.tar\.gz' }
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then TAG="$RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"
          else echo "workflow_dispatch must run on a tag ref (got $GITHUB_REF)" >&2; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download asset + checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern '${{ matrix.pattern }}' --dir assets
          gh release download "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS*' --dir assets
          ls -lh assets

      - name: Verify checksum before attesting
        id: asset
        run: |
          cd assets
          FILE=$(find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' | grep -E '^${{ matrix.name }}$' || true)
          [ "$(printf '%s\n' "$FILE" | grep -c .)" -eq 1 ] || { echo "expected exactly one asset named like '${{ matrix.name }}', got: $FILE" >&2; exit 1; }
          EXPECTED=$(awk -v f="$FILE" '$2 == f { print $1 }' SHA256SUMS*)
          [ -n "$EXPECTED" ] || { echo "$FILE is not in SHA256SUMS; refusing to attest" >&2; exit 1; }
          ACTUAL=$(sha256sum "$FILE" | awk '{ print $1 }')
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "checksum mismatch for $FILE; refusing to attest" >&2; exit 1; }
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Attest
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: assets/${{ steps.asset.outputs.file }}
          predicate-type: 'https://researchzosho.org/attestation/release/v1'
          predicate: >-
            {"tag": "${{ steps.tag.outputs.tag }}",
             "checksumSource": "release SHA256SUMS, verified pre-attestation",
             "builder": "built and tried on real machines before publish, not by this runner",
             "attestedBy": "post-publish attestation via .github/workflows/release.yml"}

      - name: Upload bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE="${{ steps.attest.outputs.bundle-path }}"
          [ -n "$BUNDLE" ] && [ -f "$BUNDLE" ] || { echo "no bundle" >&2; exit 1; }
          OUT="assets/${{ steps.asset.outputs.file }}.sigstore.json"
          cp "$BUNDLE" "$OUT"
          gh release upload "${{ steps.tag.outputs.tag }}" "$OUT" --repo "$GITHUB_REPOSITORY" --clobber

  # The same bytes, in a container: the attested tarball unpacked on a Java runtime, pushed to ghcr.io as
  # wyrdsekai/researchzosho:<version> and :latest. Nothing is compiled here either.
  image:
    name: Image on ghcr.io
    needs: attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Download the attested tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ctx
          gh release download "v${{ steps.v.outputs.ver }}" --repo "$GITHUB_REPOSITORY" --pattern "researchzosho-${{ steps.v.outputs.ver }}.tar.gz" --pattern 'SHA256SUMS' --dir ctx
          cd ctx && sha256sum -c --ignore-missing SHA256SUMS
          cp ../packaging/docker/entrypoint.sh .
      - name: Build and push
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 -f packaging/docker/Dockerfile \
            --build-arg VERSION="${{ steps.v.outputs.ver }}" \
            -t "ghcr.io/wyrdsekai/researchzosho:${{ steps.v.outputs.ver }}" -t ghcr.io/wyrdsekai/researchzosho:latest \
            --push ctx

  # The npm launcher (npm/): the package version is the release's; trusted publishing signs it with this workflow's
  # identity (no token; set up once on npmjs.com for the package, after its first publish by hand — RELEASING.md).
  # A version already on npm — the first one, published by hand — is left alone.
  launcher:
    name: Launcher on npm
    needs: attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: npm 11.5+ (trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: The launcher names this release
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          V=$(node -p "require('./npm/package.json').version")
          [ "$V" = "${TAG#v}" ] || { echo "npm/package.json says $V, the release is ${TAG#v}" >&2; exit 1; }
          cd npm && npm test
      - name: Publish
        working-directory: npm
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@wyrdsekai/researchzosho-mcp@$V" version >/dev/null 2>&1; then echo "already on npm: $V"; exit 0; fi
          npm publish --access public

  # The MCP Registry entry (server.json): the npm launcher and the image it names must exist first.
  registry:
    name: MCP Registry
    needs: [launcher, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - name: mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help | head -1
      - name: server.json names this release
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          V=$(jq -r .version server.json)
          [ "$V" = "${TAG#v}" ] || { echo "server.json says $V, the release is ${TAG#v}" >&2; exit 1; }
          ./mcp-publisher validate
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5 6; do ./mcp-publisher publish && exit 0; echo "retry $i: npm may still be propagating"; sleep 30; done
          exit 1

