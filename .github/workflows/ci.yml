name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 21 is the floor the code targets; 25 is what a current install gives you. Both, because an
        # exact toolchain pin once meant a machine with only the newer JDK could not build at all.
        include:
          - os: ubuntu-latest
            java: '21'
          - os: ubuntu-latest
            java: '25'
          - os: macos-latest
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :librarian:test :client:test --console=plain
